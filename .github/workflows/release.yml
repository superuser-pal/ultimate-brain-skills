# Snapshot releases (spec/skills-delivery.md §10.2). A refused tag creates nothing; delete it and tag again.
name: Release

on:
  push:
    tags: ["brain-v*"]

permissions:
  contents: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tools
      - name: Release the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release.mjs --tag "$GITHUB_REF_NAME"

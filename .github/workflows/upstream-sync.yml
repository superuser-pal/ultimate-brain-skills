# Upstream-change detection (spec/skills-delivery.md §10.5): opens or updates one PR, or one issue. Never merges.
name: Upstream sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require UPSTREAM_SYNC_TOKEN
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::The Actions secret UPSTREAM_SYNC_TOKEN is missing. See NOTICE.md; this workflow never falls back to GITHUB_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tools
      - name: Sync
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: node tools/upstream-sync.mjs
